<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#27272a"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <filter id="amberGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#f59e0b" flood-opacity="0.6"/>
    </filter>
  </defs>
  <!-- Sleek Dark Squircle Tile -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
  
  <!-- Modern K Monogram -->
  <text x="28" y="45" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Space Grotesk', sans-serif" font-size="36" font-weight="900" fill="#ffffff" text-anchor="middle">K</text>
  
  <!-- Amber Telemetry Accent Dot -->
  <circle cx="45" cy="41" r="4.5" fill="#f59e0b" filter="url(#amberGlow)"/>
</svg>
